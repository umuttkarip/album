name: Verify Album and redirect Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          ALBUM_PUBLIC_BASE: /
          ALBUM_SAME_ORIGIN: '1'
      - name: Verify private API
        run: node independent/probe-api.mjs
        env:
          ALBUM_API_BASE: https://album.umuttkarip.workers.dev
      - name: Verify built assets
        run: node independent/probe-build.mjs
        env:
          ALBUM_PUBLIC_BASE: /
      - name: Prepare canonical site redirect
        run: node independent/build-redirect.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local/redirect-public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
